# NGUỒN SỰ THẬT DUY NHẤT cho mọi giả định. Chỉ TV1 sửa, qua Pull Request.
# Mỗi dòng có mã A# trùng với Sổ giả định trên Drive.
# Sửa đổi 26/10/2026: dữ liệu bắt đầu 11/2018 do giới hạn vnstock
#   cấp miễn phí (tối đa 2.920 ngày lịch sử); cửa sổ ước lượng mở rộng tới 756 phiên.
#   Xem docs/00_BOI_CANH_CHUNG.md mục 6.
# Sửa đổi 29/10/2026 (TV1 duyệt): A7 giữ 0,15%/chiều và ghi rõ là GIẢ ĐỊNH (không tách phí sàn);
#   A8 giữ 0,1%, đổi nguồn sang Luật 109/2025/QH15; A12 đổi 0.0792 -> 0.0813 theo Damodaran ctryprem 05/01/2026.

universe:
  source: "VN30 ky xem xet 1/2020"          # A1 – TV2 điền danh sách vào data/raw/vn30_2020.csv
  require_history_from: "2018-11-01"         # A1/A14 – chỉ giữ mã có đủ giá từ ngày này

data:
  start: "2018-11-01"                        # A14 – giới hạn vnstock miễn phí 2.920 ngày
  end: "2026-09-30"
  benchmark: "VNINDEX"
  max_ffill_days: 5                          # điền giá trước đó tối đa 5 phiên, có cột cờ imputed

periods:
  estimation_window_days: 756                # A13 – tối đa: 3 năm x 252 phiên
  min_estimation_window_days: 252            # A13 – mới: chưa đủ 756 phiên thì dùng toàn bộ dữ liệu có sẵn,
                                             #   tối thiểu 252 phiên (chỉ xảy ra ở validation 2020–2021)
  estimation_window_mode: "expanding_then_rolling"   # A13 – cửa sổ = dữ liệu từ max(data.start, t − 756 phiên) đến t
  validation: ["2020-01-01", "2021-12-31"]   # chỉ để chọn thiết kế; ghi window_len mỗi kỳ
  test: ["2022-01-01", "2026-09-30"]         # chạy 1 lần sau khi đóng băng (03/11); luôn đủ 756 phiên
  lop1_window: ["2023-10-01", "2026-09-30"]  # số liệu Lớp 1

conventions:
  trading_days_per_year: 252
  sortino_threshold: "rf"
  turnover: "half_sum_abs_change"

portfolio:
  nav_vnd: 100000000000                      # A2 – 100 tỷ đồng
  lot_size: 100                              # A3
  cash_return: 0.0                           # A4 – tiền dư không sinh lãi
  long_only: true
  w_max: 0.10                                # A5
  rebalance: "quarterly"                     # A6 – tính cuối quý, giao dịch phiên đầu quý sau

costs:
  fee_per_side: 0.0015                       # A7 – GIẢ ĐỊNH của nhóm: 0.15%/chiều (môi giới + phí sàn gộp)
                                             #   mức phổ biến các CTCK 0.03–0.35%, trần môi giới 0.5% (TT 128/2018/TT-BTC)
                                             #   độ nhạy 0.10%–0.40% (xem sensitivity)
  sell_tax: 0.001                            # A8 – thuế TNCN 0.1% giá chuyển nhượng, chỉ chiều bán
                                             #   (Luật 109/2025/QH15, hiệu lực 1/7/2026;
                                             #   trước đó TT 92/2015/TT-BTC)
risk_free:
  source: "TPCP 10 nam, binh quan theo nam"  # A9

estimation:
  expected_returns: "capm"                   # A10 – "capm" | "historical"; chốt 02/11 theo validation
  covariance: "ledoit_wolf"                  # A11 – "ledoit_wolf" | "sample"; chốt 02/11
  market_risk_premium: 0.0813                # A12 – Damodaran ctryprem, "ERPs by country", cập nhật 05/01/2026:
                                             #   Việt Nam Ba2, default spread 2.56%, CRP 3.90%, ERP tổng 8.13%
                                             #   (độ nhạy: 6.31% theo CDS, ±1 điểm %)

strategies: ["equal_weight", "min_variance", "max_sharpe", "risk_parity"]

sensitivity:
  w_max: [0.05, 0.10, 0.15, 0.20]
  rebalance: ["monthly", "quarterly", "semiannual"]
  fee_per_side: [0.0010, 0.0015, 0.0025, 0.0040]
  rf_shift: [-0.01, 0.0, 0.01]
  market_risk_premium: [0.0631, 0.0813, 0.0913]   # A12 – thêm mới, khớp cột F14 trong Sổ giả định

seed: 42
